<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EADD"/><stop offset="1" stop-color="#E6D5BF"/></linearGradient>
<radialGradient id="amb" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#E9B96A"/><stop offset="1" stop-color="#B9772F"/></radialGradient>
<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".35"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="90" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#2A1D12" letter-spacing="2">Maison Orée</text>
